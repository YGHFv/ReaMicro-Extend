// Android dependency subset of rc01; derived icon subsets are identified in NOTICE.
def upstreamModule = rootProject.file("third_party/miuix/upstream/${project.name}")
def namespaces = [icons: 'icon', 'glass-icons': 'icon.glass']
def moduleName = project.name.substring('miuix-'.length())
def commonSources = files(fileTree(new File(upstreamModule, 'src/commonMain/kotlin')) { include '**/*.kt' })
def androidSources = fileTree(new File(upstreamModule, 'src/androidMain/kotlin')) { include '**/*.kt' }
def adapterSources = fileTree(new File(project.projectDir, 'src/main/kotlin')) { include '**/*.kt' }
ext.miuixCommonSources = commonSources

android {
    namespace "top.yukonga.miuix.kmp.${namespaces.get(moduleName, moduleName)}"
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    defaultConfig { minSdk = moduleName in ['blur', 'glass'] ? 33 : 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { compose true }
    sourceSets {
        main {
            java.srcDirs = [
                new File(upstreamModule, 'src/commonMain/kotlin'),
                new File(upstreamModule, 'src/androidMain/kotlin'),
                new File(project.projectDir, 'src/main/kotlin'),
            ]
            baselineProfiles.srcDir(new File(upstreamModule, 'src/androidMain/baselineProfiles'))
        }
    }
}

// Applied scripts do not inherit plugin type imports. Configure the AGP Kotlin tasks directly.
tasks.configureEach {
    if (name.startsWith('compile') && name.endsWith('Kotlin') && !name.contains('Test')) {
        source(commonSources, androidSources, adapterSources)
        compilerOptions.freeCompilerArgs.addAll('-Xmulti-platform', '-Xexpect-actual-classes')
        compilerOptions.freeCompilerArgs.add(provider {
            '-Xcommon-sources=' + commonSources.files.sort { it.path }.collect { it.absolutePath }.join(',')
        })
    }
}

// AGP applies its incremental default after task registration. These Android-only adapters
// compile common and actual sources together, so every common declaration must be present.
afterEvaluate {
    tasks.configureEach {
        if (name.startsWith('compile') && name.endsWith('Kotlin') && !name.contains('Test')) {
            incremental = false
        }
    }
}

dependencies {
    if (moduleName in ['ui', 'preference']) {
        api libs.compose.foundation
    } else {
        implementation libs.compose.foundation
    }

    switch (moduleName) {
        case 'squircle':
        case 'blur':
            api project(':miuix-material')
            break
        case 'ui':
            api project(':miuix-core')
            api project(':miuix-squircle')
            implementation libs.androidx.navigationevent
            implementation libs.materialkolor.utilities
            break
        case 'preference':
            api project(':miuix-ui')
            break
        case 'icons':
        case 'glass-icons':
            api project(':miuix-core')
            break
        case 'glass':
            api project(':miuix-blur')
            api project(':miuix-material')
            api project(':miuix-ui')
            implementation libs.androidx.navigationevent
            break
        case 'nav':
            implementation project(':miuix-squircle')
            implementation libs.androidx.navigationevent
            implementation libs.lifecycle.runtime
            implementation libs.lifecycle.runtime.compose
            implementation libs.lifecycle.viewmodel
            implementation libs.lifecycle.viewmodel.compose
            implementation libs.kotlinx.collections.immutable
            implementation libs.kotlinx.serialization.json
            break
    }
}
