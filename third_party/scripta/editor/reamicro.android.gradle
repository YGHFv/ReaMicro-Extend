import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
}
// Groovy avoids AGP 9.2's AndroidLibrarySourceSet Kotlin DSL cast.
// Only the pinned editor library is compiled; no upstream sandbox application.
android {
    namespace 'top.yukonga.scripta.editor'
    compileSdk 37
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { compose true }
    sourceSets {
        main.java.srcDirs = ['src/commonMain/kotlin', 'src/androidMain/kotlin']
    }
}
def commonSources = fileTree('src/commonMain/kotlin') { include '**/*.kt' }
tasks.withType(KotlinCompile).configureEach {
    if (!name.contains('Test')) {
        source(commonSources, fileTree('src/androidMain/kotlin') { include '**/*.kt' })
        compilerOptions.freeCompilerArgs.addAll(
            '-Xmulti-platform',
            '-Xexpect-actual-classes',
            '-Xcommon-sources=' + commonSources.files.sort { it.path }.collect { it.absolutePath }.join(',')
        )
    }
}
dependencies {
    api 'org.jetbrains.compose.foundation:foundation-android:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-core:1.10.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
}