# Detekt 2：检查生产源码的无用引用，保留体积与复杂度报告。
# 配合 Android 变体任务 detektDebug 的类型解析；仅启用下面列出的规则，
# 避免 Compose 和宿主反射代码被命名、参数数量等风格规则淹没。
# 规则发现仍只报告，配置错误和执行失败必须阻断 CI。
config:
  validation: true
  warningsAsErrors: true

style:
  active: true
  UnusedImport:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedVariable:
    active: true

complexity:
  active: true
  LargeClass:
    active: true
    allowedLines: 1500
  LongMethod:
    active: true
    allowedLines: 120
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 80
    allowedFunctionsPerClass: 80
    allowedFunctionsPerInterface: 80
    allowedFunctionsPerObject: 80
    allowedFunctionsPerEnum: 80
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: true
