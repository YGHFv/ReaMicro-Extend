services:
  api:
    image: ghcr.io/yghfv/reamicro-extend/reamicro-api:latest
    container_name: reamicro-api
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5222/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "5222:5222"
    volumes:
      - ./data:/data
    environment:
      REAMICRO_SERVER_ID: ${REAMICRO_SERVER_ID:-reamicro-api}
      REAMICRO_API_KEY: ${REAMICRO_API_KEY:-}
      REAMICRO_ALLOW_PUBLIC: ${REAMICRO_ALLOW_PUBLIC:-true}
      REAMICRO_FEATURES: ${REAMICRO_FEATURES:-association_source,theme_library,style_library,book_source_library,backup,module_update}
      REAMICRO_MIN_MODULE_VERSION: ${REAMICRO_MIN_MODULE_VERSION:-2.0.0}
      REAMICRO_PACKAGE_ROOT: /data/packages
      REAMICRO_SIGNING_PUBLIC_KEY: ${REAMICRO_SIGNING_PUBLIC_KEY:-}
      REAMICRO_GITHUB_REPOSITORY: ${REAMICRO_GITHUB_REPOSITORY:-YGHFv/ReaMicro-Extend}
      REAMICRO_GITHUB_TOKEN: ${REAMICRO_GITHUB_TOKEN:-}
      REAMICRO_GITHUB_INCLUDE_PRERELEASE: ${REAMICRO_GITHUB_INCLUDE_PRERELEASE:-false}
      REAMICRO_GITHUB_WEBHOOK_SECRET: ${REAMICRO_GITHUB_WEBHOOK_SECRET:-}
      REAMICRO_RELEASE_SYNC_SECONDS: ${REAMICRO_RELEASE_SYNC_SECONDS:-1800}
      REAMICRO_RELEASE_ROOT: /data/releases/module
      REAMICRO_RELEASE_VERSION_CODE: ${REAMICRO_RELEASE_VERSION_CODE:-0}
      REAMICRO_CONFIG_ROOT: /data/config
      REAMICRO_ADMIN_USERNAME: ${REAMICRO_ADMIN_USERNAME:-admin}
      REAMICRO_ADMIN_PASSWORD: ${REAMICRO_ADMIN_PASSWORD:-}
      REAMICRO_ADMIN_SESSION_SECONDS: ${REAMICRO_ADMIN_SESSION_SECONDS:-43200}
      REAMICRO_ADMIN_COOKIE_SECURE: ${REAMICRO_ADMIN_COOKIE_SECURE:-true}
      REAMICRO_SIGNING_PRIVATE_KEY_FILE: ${REAMICRO_SIGNING_PRIVATE_KEY_FILE:-}
      REAMICRO_BACKUP_ROOT: /data/backups
      REAMICRO_TASK_ROOT: /data/tasks
      REAMICRO_STATE_DB: /data/state/reamicro.sqlite3
      REAMICRO_SECRET_KEY: ${REAMICRO_SECRET_KEY:-}
      REAMICRO_SECRET_BACKUP_ROOT: /data/backups/secrets
      REAMICRO_SERVER_BACKUP_ROOT: /data/backups/server
      REAMICRO_SERVER_SNAPSHOT_ENABLED: ${REAMICRO_SERVER_SNAPSHOT_ENABLED:-true}
      REAMICRO_SERVER_SNAPSHOT_SECONDS: ${REAMICRO_SERVER_SNAPSHOT_SECONDS:-86400}
      REAMICRO_SERVER_SNAPSHOT_RETENTION: ${REAMICRO_SERVER_SNAPSHOT_RETENTION:-30}
      REAMICRO_AUDIT_ROOT: /data/audit
      REAMICRO_RATE_LIMIT: ${REAMICRO_RATE_LIMIT:-120}
      REAMICRO_RUN_SCHEDULER: "false"
      REAMICRO_RUN_RELEASE_SYNC: "true"

  worker:
    image: ghcr.io/yghfv/reamicro-extend/reamicro-api:latest
    pull_policy: always
    container_name: reamicro-worker
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["python", "-m", "app.worker"]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ./data:/data
    environment:
      REAMICRO_CONFIG_ROOT: /data/config
      REAMICRO_TASK_ROOT: /data/tasks
      REAMICRO_ACCOUNT_ROOT: /data/accounts
      REAMICRO_STATE_DB: /data/state/reamicro.sqlite3
      REAMICRO_SECRET_KEY: ${REAMICRO_SECRET_KEY:-}
      REAMICRO_RUN_SCHEDULER: "true"
      REAMICRO_RUN_RELEASE_SYNC: "false"
      REAMICRO_SERVER_SNAPSHOT_ENABLED: ${REAMICRO_SERVER_SNAPSHOT_ENABLED:-true}
      REAMICRO_SERVER_SNAPSHOT_SECONDS: ${REAMICRO_SERVER_SNAPSHOT_SECONDS:-86400}
      REAMICRO_SERVER_SNAPSHOT_RETENTION: ${REAMICRO_SERVER_SNAPSHOT_RETENTION:-30}
      REAMICRO_ADMIN_SESSION_SECONDS: ${REAMICRO_ADMIN_SESSION_SECONDS:-43200}
      REAMICRO_ADMIN_COOKIE_SECURE: ${REAMICRO_ADMIN_COOKIE_SECURE:-true}

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: reamicro-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 私有 GHCR 时取消下一行注释，并替换为实际 Docker config 路径。
      # - /root/.docker/config.json:/config.json:ro
    command: --label-enable --interval ${REAMICRO_IMAGE_UPDATE_INTERVAL:-300} --cleanup --rolling-restart
