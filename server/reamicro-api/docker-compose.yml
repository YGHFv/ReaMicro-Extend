services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "5222:5222"
    volumes:
      - ./data:/data
    environment:
      REAMICRO_SERVER_ID: ${REAMICRO_SERVER_ID:-reamicro-api}
      REAMICRO_API_KEY: ${REAMICRO_API_KEY:-}
      REAMICRO_ALLOW_PUBLIC: ${REAMICRO_ALLOW_PUBLIC:-true}
      REAMICRO_FEATURES: ${REAMICRO_FEATURES:-association_source,theme_library,style_library,book_source_library,backup,module_update}
      REAMICRO_MIN_MODULE_VERSION: ${REAMICRO_MIN_MODULE_VERSION:-2.0.0}
      REAMICRO_PACKAGE_ROOT: /data/packages
      REAMICRO_SIGNING_PUBLIC_KEY: ${REAMICRO_SIGNING_PUBLIC_KEY:-}
      REAMICRO_GITHUB_REPOSITORY: ${REAMICRO_GITHUB_REPOSITORY:-YGHFv/ReaMicro-Extend}
      REAMICRO_GITHUB_TOKEN: ${REAMICRO_GITHUB_TOKEN:-}
      REAMICRO_GITHUB_INCLUDE_PRERELEASE: ${REAMICRO_GITHUB_INCLUDE_PRERELEASE:-false}
      REAMICRO_RELEASE_SYNC_SECONDS: ${REAMICRO_RELEASE_SYNC_SECONDS:-1800}
      REAMICRO_RELEASE_ROOT: /data/releases/module
      REAMICRO_RELEASE_VERSION_CODE: ${REAMICRO_RELEASE_VERSION_CODE:-0}
      REAMICRO_CONFIG_ROOT: /data/config
      REAMICRO_ADMIN_USERNAME: ${REAMICRO_ADMIN_USERNAME:-admin}
      REAMICRO_ADMIN_PASSWORD: ${REAMICRO_ADMIN_PASSWORD:-}
      REAMICRO_SIGNING_PRIVATE_KEY_FILE: ${REAMICRO_SIGNING_PRIVATE_KEY_FILE:-}
